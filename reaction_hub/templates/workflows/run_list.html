{% extends "base.html" %}
{% load django_tables2 %}
{% block content %}
<div class="card">
  <h3>Workflow Runs</h3>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
    <a
      style="display:inline-block;padding:6px 10px;border:1px solid #1d4ed8;border-radius:6px;background:#2563eb;text-decoration:none;color:#fff;"
      href="/results/"
    >
      Open Results
    </a>
  </div>
  <form method="get">
    <input type="hidden" name="page" value="1" />
    {{ filter.form.as_p }}
    <div class="form-row">
      <label for="workflow-page-size">Rows per page</label><br />
      <select id="workflow-page-size" name="page_size">
        {% for size in page_size_options %}
        <option value="{{ size }}" {% if page_size == size %}selected{% endif %}>{{ size }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit">Filter</button>
  </form>
</div>
<div class="card">
  {% render_table table %}
</div>
{% endblock %}
