{% extends "base.html" %}
{% load django_tables2 %}
{% block content %}
<div class="card">
  <h3>Jobs</h3>
  <form method="get">
    <input type="hidden" name="page" value="1" />
    {{ filter.form.as_p }}
    <div class="form-row">
      <label for="job-page-size">Rows per page</label><br />
      <select id="job-page-size" name="page_size">
        {% for size in page_size_options %}
        <option value="{{ size }}" {% if page_size == size %}selected{% endif %}>{{ size }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit">Filter</button>
  </form>
</div>
<div class="card">
  {% if cancelled_jobs_total > 0 %}
  <form method="post" action="{% url 'job-mark-cancelled-deleted' %}" style="margin:0 0 12px 0;">
    {% csrf_token %}
    <button
      type="submit"
      onclick="return confirm('Mark all cancelled jobs for deletion?');"
    >
      Mark All Cancelled For Deletion ({{ cancelled_jobs_total }})
    </button>
  </form>
  {% endif %}
  {% render_table table %}
</div>
{% endblock %}
