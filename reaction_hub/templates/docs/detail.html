{% extends "base.html" %}

{% block extra_head %}
  <style>
    .markdown-body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #24292f;
      word-break: break-word;
    }
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      margin-top: 1.2em;
      margin-bottom: 0.55em;
      line-height: 1.25;
      font-weight: 600;
      border-bottom: 1px solid #d8dee4;
      padding-bottom: 0.3em;
    }
    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body table,
    .markdown-body pre,
    .markdown-body blockquote {
      margin-top: 0;
      margin-bottom: 1em;
    }
    .markdown-body ul,
    .markdown-body ol {
      padding-left: 2em;
    }
    .markdown-body blockquote {
      margin-left: 0;
      padding: 0 1em;
      color: #57606a;
      border-left: 0.25em solid #d0d7de;
    }
    .markdown-body code {
      font-family: ui-monospace, SFMono-Regular, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background: #f6f8fa;
      border-radius: 6px;
      padding: 0.15em 0.35em;
      font-size: 0.92em;
    }
    .markdown-body pre {
      background: #0d1117;
      color: #e6edf3;
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
    }
    .markdown-body pre code {
      background: transparent;
      color: inherit;
      padding: 0;
      border-radius: 0;
    }
    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      display: block;
      overflow-x: auto;
    }
    .markdown-body th,
    .markdown-body td {
      border: 1px solid #d0d7de;
      padding: 6px 10px;
      text-align: left;
    }
    .markdown-body th {
      background: #f6f8fa;
      font-weight: 600;
    }
    .markdown-body a {
      color: #0969da;
      text-decoration: none;
    }
    .markdown-body a:hover {
      text-decoration: underline;
    }
    .docs-source {
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
{% endblock %}

{% block content %}
<div class="card">
  <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;">
    <div>
      <h3 style="margin:0;">{{ doc_name }}</h3>
      <div class="muted">{{ doc_path }}</div>
    </div>
    <div>
      <a href="{% url 'docs-index' %}">Back to docs</a>
    </div>
  </div>
</div>

<div class="card">
  {% if doc_html %}
    <article class="markdown-body">{{ doc_html }}</article>
  {% else %}
    <div class="muted" style="margin-bottom:10px;">
      Markdown renderer not available. Install <code>Markdown</code> to render docs like GitHub.
    </div>
    <pre class="docs-source">{{ doc_source }}</pre>
  {% endif %}
</div>
{% endblock %}
